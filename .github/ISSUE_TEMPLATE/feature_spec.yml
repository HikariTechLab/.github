name: "🚀 Feature or AI Agent Capability Specification"
description: "Propose a new microservice feature, IDP capability, or multi-agent workflow"
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: input
    id: summary
    attributes:
      label: "Feature Summary (One-Line Intent)"
      description: "Concise statement of the capability or behavior to implement."
      placeholder: "e.g., Add /v1/fleet/clusters endpoint to hikari-status-api"
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: "Target Repository & Module Scope"
      description: "Which repository and directory path will this change target?"
      placeholder: "e.g., hikari-workloads (services/hikari-status-api) or cerebro (src/orchestrator)"
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "Acceptance Criteria (Given / When / Then)"
      description: "Define clear, testable acceptance criteria."
      render: gherkin
      value: |
        Feature: <Feature Name>

          Scenario: <Primary happy or error path>
            Given <initial state>
            When <action or request>
            Then <expected deterministic outcome>
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: "Security, Runtime & FinOps Considerations"
      description: "Any Kyverno compliance requirements, OIDC permissions, rate limits, or cost considerations."
      placeholder: "- Runs as non-root Distroless container (UID 65532)\n- Requires read-only IAM binding on..."
    validations:
      required: false
