name: "☁️ Cloud Foundation (L0), IDP Control Plane (L1) or Claim (L2) Change"
description: "Propose a Terraform foundation update, Crossplane/Sveltos composition, or self-service claim"
title: "[PLATFORM] "
labels: ["platform", "infrastructure"]
body:
  - type: dropdown
    id: layer
    attributes:
      label: "Target Platform Layer"
      description: "Select the HikariTech IDP layer affected."
      options:
        - "Layer 0 (hikari-org-infra) — bootstrap/ | platform/<env>/ | apps/<app>/<env>/ | clients/<client>/<env>/"
        - "Layer 1 (hikari-platform) — Argo CD | Crossplane v2 XRD/Composition | Sveltos ClusterProfile | Kyverno Policy"
        - "Layer 2 (hikari-workloads) — Self-Service Claim (GkeCluster / StorageBucket) | Kustomize Fleet Overlay"
        - "FinOps — Spoke Cluster Lifecycle / Budget / Resource Optimization"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: "Target Environment"
      options:
        - "nonprod"
        - "prd"
        - "Common / Organization-Wide"
    validations:
      required: true

  - type: textarea
    id: intent
    attributes:
      label: "Architectural Intent & Resources"
      description: "Describe the GCP resources, Crossplane compositions, fleet policies, or claims to add/modify and why."
      placeholder: "e.g., Add Cloud SQL PostgreSQL Crossplane XRD & Composition for nonprod tenant workloads..."
    validations:
      required: true

  - type: checkboxes
    id: governance
    attributes:
      label: "HikariTech Platform Governance Checklist"
      options:
        - label: "Changes will be delivered strictly via Git PR (zero manual GCP Console or imperative `kubectl` drift)."
          required: true
        - label: "Zero static service account keys used (100% Workload Identity / OIDC)."
          required: true
        - label: "All resources carry mandatory cost-attribution labels (`app`, `environment`, `component`, `managed_by`)."
          required: true
