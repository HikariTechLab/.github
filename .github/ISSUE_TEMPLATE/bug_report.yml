name: "🐛 Bug or Reconciliation Regression Report"
description: "Report a deterministic bug, CI failure, or GitOps/Crossplane reconciliation issue"
title: "[BUG] "
labels: ["bug"]
body:
  - type: input
    id: component
    attributes:
      label: "Affected Repository & Component"
      description: "Which repository, service, Argo CD app, Crossplane composition, or agent is affected?"
      placeholder: "e.g., hikari-platform (bootstrap/apps/03-claims-nonprod.yaml) or hikari-workloads (services/hikari-status-api)"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: "Reproduction Steps"
      description: "Exact command, PR, manifest, or input payload that triggers the issue."
      placeholder: |
        1. Apply / run ...
        2. Observe status in ...
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: "Expected vs. Actual Behavior"
      description: "What should happen vs. what actually occurred (include sanitized logs or events)."
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: "Where Was This Detected?"
      options:
        - "Local Development / Unit Tests"
        - "GitHub Actions CI Pipeline"
        - "Non-Production (`nonprod` Hub / Spoke)"
        - "Production (`prd` Hub / Spoke)"
    validations:
      required: true
